name: Link audit

on:
  schedule:
    - cron: "29 10 1,15 * *"
  workflow_dispatch:
    inputs:
      strict:
        description: Treat blocked and transient responses as failures
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: link-audit
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install 3.13
          uv sync --all-groups

      - name: Check catalog links
        shell: bash
        run: |
          args=(--json-output output/link-audit.json)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.strict }}" == "true" ]]; then
            args+=(--strict)
          fi
          uv run awesome-iina repository links src/awesome_iina/catalog/catalog.yaml "${args[@]}"

      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-audit
          path: output/link-audit.json
          if-no-files-found: warn
          retention-days: 14
