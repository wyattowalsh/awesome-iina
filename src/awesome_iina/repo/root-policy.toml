version = 1

allowed_files = [
  ".editorconfig",
  ".env.example",
  ".gitattributes",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".python-version",
  "AGENTS.md",
  "CITATION.cff",
  "copier.yml",
  "LICENSE",
  "README.md",
  "justfile",
  "pyproject.toml",
  "uv.lock",
]

required_files = [
  ".gitignore",
  ".python-version",
  "AGENTS.md",
  "LICENSE",
  "README.md",
  "justfile",
  "pyproject.toml",
]

ignored_files = [
  ".coverage",
  ".DS_Store",
  ".envrc",
  "SOURCE-MANIFEST.json",
  "coverage.xml",
]

allowed_directories = [
  ".github",
  "starter",
  "docs",
  "skills",
  "src",
  "tests",
]

ignored_directories = [
  ".cursor",
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".ty_cache",
  ".venv",
  ".vscode",
  "build",
  "dist",
  "htmlcov",
  "media-reports",
  "node_modules",
  "output",
]

[relocations]
"CHANGELOG.md" = "docs/history/CHANGELOG.md"
"CODE_OF_CONDUCT.md" = ".github/CODE_OF_CONDUCT.md"
"CONTRIBUTING.md" = ".github/CONTRIBUTING.md"
"DESIGN.md" = "docs/maintain/design.md"
"GOVERNANCE.md" = ".github/GOVERNANCE.md"
"NOTICE.md" = "docs/history/NOTICE.md"
"ROADMAP.md" = "docs/history/ROADMAP.md"
"SECURITY.md" = ".github/SECURITY.md"
"SUPPORT.md" = ".github/SUPPORT.md"
